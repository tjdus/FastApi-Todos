[loggers]
keys=root,uvicorn,uvicorn.error,uvicorn.access

[handlers]
keys=file

[formatters]
keys=default

[logger_root]
level=INFO
handlers=file

[logger_uvicorn]
level=INFO
handlers=file
propagate=1

[logger_uvicorn.error]
level=INFO
handlers=file
propagate=1

[logger_uvicorn.access]
level=INFO
handlers=file
propagate=1

[handler_file]
class=logging.FileHandler
level=INFO
formatter=default
args=('/var/log/app.log','a')

[formatter_default]
format=%(asctime)s %(levelname)s %(message)s
